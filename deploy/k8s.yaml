apiVersion: apps/v1
kind: Deployment
metadata: { name: deepcheck, labels: { app: deepcheck } }
spec:
  replicas: 1
  selector: { matchLabels: { app: deepcheck } }
  template:
    metadata: { labels: { app: deepcheck } }
    spec:
      containers:
        - name: deepcheck
          image: ghcr.io/cognis-digital/deepcheck:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: deepcheck }
spec:
  selector: { app: deepcheck }
  ports: [{ port: 80, targetPort: 8000 }]
